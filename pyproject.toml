[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ternary-gtf"
version = "0.1.0"
description = "Greedy Temporal Fitting with ternary spike bases"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
notebook = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "seaborn>=0.13",
]
snn = [
    "torch>=2.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gtf"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".venv", ".uv-cache", "artifacts", "data"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["gtf"]
